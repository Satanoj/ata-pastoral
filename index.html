<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ata Pastoral</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#f4f1ea;color:#1d1d1f}main{max-width:840px;margin:auto;padding:24px}.card{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 25px #0001}button{border:0;border-radius:12px;padding:13px 16px;margin:6px;font-weight:700;background:#285c4d;color:white}button.secondary{background:#76552b}button.danger{background:#9d2f2f}textarea{width:100%;min-height:170px;border-radius:14px;border:1px solid #ccc;padding:12px;font-size:15px}audio{width:100%}.muted{color:#666}.status{font-weight:700;color:#285c4d}h1{margin-bottom:0}.row{display:flex;gap:8px;flex-wrap:wrap}</style>
</head>
<body>
<main>
<h1>Ata Pastoral</h1>
<p class="muted">Grave reuniões, transcreva e gere resumo/ata.</p>
<div class="card">
<h2>1. Gravação</h2>
<div class="row">
<button id="startBtn">Iniciar gravação</button>
<button id="stopBtn" class="danger" disabled>Parar gravação</button>
<button id="downloadBtn" class="secondary" disabled>Baixar áudio</button>
</div>
<p id="recStatus" class="status">Pronto para gravar.</p>
<audio id="audio" controls></audio>
</div>
<div class="card">
<h2>2. Transcrição e resumo</h2>
<button id="processBtn" disabled>Transcrever e resumir</button>
<p id="serverStatus" class="status">Aguardando áudio.</p>
<label>Transcrição</label>
<textarea id="transcript" placeholder="A transcrição aparecerá aqui..."></textarea>
<label>Resumo / Ata</label>
<textarea id="summary" placeholder="O resumo aparecerá aqui..."></textarea>
</div>
<div class="card">
<h2>Observação</h2>
<p class="muted">Para transcrever, este site precisa ser publicado com Netlify Functions e a variável OPENAI_API_KEY configurada.</p>
</div>
</main>
<script src="app.js"></script>
</body>
</html>
